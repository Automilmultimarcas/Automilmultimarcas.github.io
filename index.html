<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WASHAPP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<style>
  body{
    background: rgb(0,0,0);
    background: linear-gradient(360deg, rgb(255, 255, 255) 0%, rgba(143, 140, 140, 0.835) 43%, rgba(255, 255, 255, 0.651) 100%);
  }
</style>

  <div class="container d-flex justify-content-center align-items-center vh-100" >
    <div style="background-color: #000000fb;" class="card p-4 shadow-bg" style="-webkit-box-shadow: 10px 10px 25px 0px rgb(0, 0, 0);
    -moz-box-shadow: 10px 10px 25px 0px rgba(0,0,0,0.51);
    box-shadow: 10px 10px 25px 0px rgba(0,0,0,0.51);
">
      <!-- Espaço para a logo -->
      <div class="text-center mb-3" style="color: white; padding: 20px;">
        <img src="logo.webp" style="width: 200px; height: auto; " alt="Logo" class="logo">      </div>

     
      <form id="loginForm">
        <div class="mb-3">
          <label for="email" class="form-label" style="color: white;">Email</label>
          <input type="email" class="form-control" id="email" placeholder="Coloque seu email" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label" style="color: white;">Senha</label>
          <input type="password" class="form-control" id="password" placeholder="Coloque sua senha" required>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary" style=" margin-top: 20px; background-color: #1d9227; border-color: rgba(255, 255, 255, 0.548);" onclick="ir()">Login</button>
        </div>
      </form>
      <div class="mt-2 text-center">
        <a href="cadastro.html" style="color: white;">Não tem uma conta? Crie uma</a>
      </div>
    </div>
  </div>

  <script >
    function ir(){
      console.log('ds')
      window.location.href = "main.html";

    }
  </script>
</body>
</html>
